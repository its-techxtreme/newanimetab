<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css">
    <title>New Anime Tab</title>
  </head>
  <body>
    <div id="app">
      <div class="content1">
        <div class="clock-container">
          <div id="clock">--:--:-- AM</div>
          <div id="date">--/--/----</div>
        </div>
        <div class="bookmarks-container">
          <a href="https://youtube.com">
            <img src="https://cdn.simpleicons.org/youtube/FF0000" alt="YouTube">
          </a>
          <a href="https://github.com/its-techxtreme">
            <img src="https://skillicons.dev/icons?i=github" alt="GitHub">
          </a>
          <a href="https://stardance.hackclub.com/@Athannn">
            <img src="https://assets.hackclub.com/icon-rounded.svg" alt="Stardance">
          </a>
          <a href="https://instagram.com/teen.bro_">
            <img src="https://skillicons.dev/icons?i=instagram" alt="Instagram">
          </a>
        </div>
        <input type="text" spellcheck="false" placeholder="Search Google..." id="query" class="search-input" autocomplete="off">
      </div>
      <div class="content2">
        <div class="horizontal">
          <button class="large" id="minus">-</button>
          <button id="pp">Play</button>
          <div id="timer">--:--:--</div>
          <button id="reset">Reset</button>
          <button class="large" id="plus">+</button>
        </div>
        <button id="stop">Stop Timer</button>
        <button id="mu">Music player</button>
      </div>
    </div>
    <div id="mw">
      <div id="mbar">
        <span>Music</span>
        <span id="macts">
          <button id="mstop">Stop</button>
          <button id="mx">X</button>
        </span>
      </div>
      <div id="mlist"></div>
      <button id="mspot">Open Spotify</button>
      <div id="mbox"></div>
    </div>
    <script>
      window.onSpotifyIframeApiReady = function (api) {
        window._spotApi = api;
      };
    </script>
    <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
